    <radialGradient id="sky" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a0a2e" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </radialGradient>
    <filter id="crt">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="screen" result="blend" />
      <feComponentTransfer in="blend">
        <feFuncA type="linear" slope="0.97" />
      </feComponentTransfer>
    </filter>
    <radialGradient id="enderglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9b30ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="portalglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7700ff" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#4400aa" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#000033" stop-opacity="0.3" />
    </radialGradient>
  </defs>

  
